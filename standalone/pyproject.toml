[project]
name = "shopflow-standalone"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "pyspark>=3.5",
    "delta-spark>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standalone"]
